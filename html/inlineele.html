<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- What actually is an inline element and block element? <br>
  An inline element is an element that does not start on a new line and only takes up as much width as necessary. Examples of inline elements include <a>, <span>, <strong>, and <em>. <br> Represented horizontally.
  A block element, on the other hand, starts on a new line and takes up the full width available. Examples of block elements include <div>, <p>, <h1> to <h6>, and <ul>. <br>Represented vertically.
  The main difference between inline and block elements is how they are displayed on the page. Block elements create a new line and take up the full width, while inline elements do not create a new line and only take up as much width as necessary. <br> -->
  <!-- P tag is a block element  -->
  <p id="para">This is a paragraph</p> 
  <!-- anchor tag is an inline element  -->
  <a href="#para">Go To paragraph</a>
</body>
</html>
